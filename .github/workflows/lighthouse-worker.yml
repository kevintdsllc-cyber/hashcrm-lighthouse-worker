name: Lighthouse Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Supabase lighthouse_jobs.id"
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Run Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check required environment variables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Missing SUPABASE_URL repo secret"; exit 1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "Missing SUPABASE_SERVICE_ROLE_KEY repo secret"; exit 1; fi
          if [ -z "$JOB_ID" ]; then echo "Missing workflow input job_id"; exit 1; fi
          echo "Required values are present."

      - name: Run Lighthouse job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: npm run run-job
